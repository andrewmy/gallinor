name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v2

      - uses: rvben/rumdl@v0.2.55
        with:
          version: 0.2.55
          install-only: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - uses: ramsey/composer-install@v3

      - run: just composer-validate
      - run: just security-check
      - run: just require-check
      - run: just lint
      - run: just stan
      - run: just markdown

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pcov

      - uses: ramsey/composer-install@v3

      - run: just coverage-check

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v2

      - run: just docker-smoke
