name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v2

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v21
        with:
          config_file: .markdownlint-cli2.jsonc
          globs: .

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - uses: ramsey/composer-install@v3

      - run: just composer-validate
      - run: just security-check
      - run: just require-check
      - run: just lint
      - run: just stan

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pcov

      - uses: ramsey/composer-install@v3

      - run: just coverage-check

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v2

      - run: just docker-smoke
